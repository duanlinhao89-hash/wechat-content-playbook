<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="财经内容运营手册 banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF6EC"/>
      <stop offset="100%" stop-color="#F3EADB"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8752A"/>
      <stop offset="100%" stop-color="#C79A4B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E8DCC6" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity="0.5"/>
  <rect x="0" y="0" width="10" height="340" fill="url(#gold)"/>

  <g opacity="0.9">
    <line x1="900" y1="90" x2="1010" y2="150" stroke="#E8DCC6" stroke-width="2"/>
    <line x1="1010" y1="150" x2="930" y2="230" stroke="#E8DCC6" stroke-width="2"/>
    <line x1="1010" y1="150" x2="1120" y2="120" stroke="#E8DCC6" stroke-width="2"/>
    <line x1="1120" y1="120" x2="1090" y2="240" stroke="#E8DCC6" stroke-width="2"/>
    <circle cx="900" cy="90" r="9" fill="#FBF6EC" stroke="#A8752A" stroke-width="2"/>
    <circle cx="1010" cy="150" r="13" fill="#A8752A"/>
    <circle cx="930" cy="230" r="7" fill="#C79A4B"/>
    <circle cx="1120" cy="120" r="9" fill="#FBF6EC" stroke="#A8752A" stroke-width="2"/>
    <circle cx="1090" cy="240" r="11" fill="#C79A4B"/>
  </g>

  <text x="70" y="130" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="700" fill="#1F1B16">财经内容运营手册</text>
  <rect x="72" y="158" width="64" height="4" fill="url(#gold)"/>
  <text x="70" y="212" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#6B6258">从选题到发布，一套可复用的深度财经内容生产系统</text>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#A8752A">
    <rect x="70" y="248" width="132" height="38" rx="19" fill="#FBF6EC" stroke="#E8DCC6" stroke-width="1"/>
    <text x="136" y="273" text-anchor="middle">六幕叙事法</text>
    <rect x="214" y="248" width="132" height="38" rx="19" fill="#FBF6EC" stroke="#E8DCC6" stroke-width="1"/>
    <text x="280" y="273" text-anchor="middle">双源核验</text>
    <rect x="358" y="248" width="132" height="38" rx="19" fill="#FBF6EC" stroke="#E8DCC6" stroke-width="1"/>
    <text x="424" y="273" text-anchor="middle">极简排版</text>
    <rect x="502" y="248" width="150" height="38" rx="19" fill="#FBF6EC" stroke="#E8DCC6" stroke-width="1"/>
    <text x="577" y="273" text-anchor="middle">模板 + 工具</text>
  </g>
</svg>
